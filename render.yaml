services:
  - type: web
    name: thealternative
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NEXT_PUBLIC_URL
        value: https://thealternative.social
      - key: NEXT_PUBLIC_USE_EMULATOR
        value: "false"
      - key: NEXT_PUBLIC_API_KEY
        value: AIzaSyBUfxktqhp2e9XC-KxRTQcAPUoim6rDiMU
      - key: NEXT_PUBLIC_AUTH_DOMAIN
        value: thealternative-ed758.firebaseapp.com
      - key: NEXT_PUBLIC_PROJECT_ID
        value: thealternative-ed758
      - key: NEXT_PUBLIC_STORAGE_BUCKET
        value: thealternative-ed758.firebasestorage.app
      - key: NEXT_PUBLIC_MESSAGING_SENDER_ID
        value: 888353612685
      - key: NEXT_PUBLIC_APP_ID
        value: 1:888353612685:web:0de52ad7099866a94ad3c4
      # Web Push (VAPID) public key — safe to expose, it is sent to browsers
      - key: NEXT_PUBLIC_FCM_VAPID_KEY
        value: BOzOWBIYilfRtV8b6A3kZ4lIqn3JQMuIaIZB3L62BMxD3vTKFcUL2Pp3ylsK72JObNh8ecznxB3Or0jsWee5nZo
      # --- server-side secrets: set these in the Render dashboard, never here ---
      # Firebase service account JSON (one line). Powers /api/push/notify and
      # /api/digest/*, which replace Cloud Functions so no Blaze plan is needed.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Shared secret guarding /api/digest/run and signing unsubscribe links
      - key: DIGEST_SECRET
        sync: false
      # Mailbox used to send the digest. Set EMAIL_HOST to send from the
      # project's own address (hello@thealternative.social via
      # mail.exclusivehosting.net); leave it unset to fall back to Gmail.
      - key: EMAIL_API
        sync: false
      - key: EMAIL_API_PASSWORD
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
